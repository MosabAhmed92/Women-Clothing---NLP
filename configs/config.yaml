# Global experiment configuration
random_seed: 42

data:
  raw_path: data/raw/womens_clothing_ecommerce_reviews_balanced.csv
  processed_dir: data/processed
  text_column: review_body
  sentiment_label: SENTIMENT # pos|neu|neg (Phase 1)
  rating_label: RATING      
  recommend_label: RECOMMEND 

preprocessing:
  lowercase: true
  strip_punctuation: true
  remove_numbers: false
  handle_negations: true
  lemmatize: true
  stopwords: english

vectorization:
  type: tfidf  # options: bow|tfidf
  ngram_range: [1, 2]
  max_features: 20000
  min_df: 2

evaluation:
  cv_folds: 5
